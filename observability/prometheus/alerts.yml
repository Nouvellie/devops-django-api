groups:
  - name: django_api_alerts
    rules:
      - alert: DjangoApiDown
        expr: up{job="django-api"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Instancia de Django API inaccesible"
          description: "El endpoint de metricas de Nginx/Django en {{ $labels.instance }} no responde hace mas de 10 segundos."